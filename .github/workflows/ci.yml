name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # Core + helper, including the tests that use the real registry.
      - name: Test
        run: cargo test -p customwin-core -p customwin-helper
      - name: Clippy
        run: cargo clippy -p customwin-core -p customwin-helper --all-targets -- -D warnings

  app:
    name: App (Windows installer)
    runs-on: windows-latest
    needs: rust
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Clippy (Tauri app)
        run: |
          npm run prepare-helper
          npm run build
          cargo clippy -p customwin-app -- -D warnings
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: CustomWin-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
