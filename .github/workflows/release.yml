name: Release

# Push a tag such as `v0.1.0` (matching the version in app/src-tauri/tauri.conf.json):
# the installer is built on Windows and attached to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match the app version v$version (app/src-tauri/tauri.conf.json)"
            exit 1
          }

      - name: Test
        run: cargo test -p customwin-core -p customwin-helper -p customwin-desktop -p customwin-taskbar

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            ## Installer

            Télécharge **CustomWin_…_x64-setup.exe** ci-dessous et lance-le (Windows 11 23H2 ou plus récent).

            L'installeur n'est pas signé : au premier lancement, Windows affiche « Windows a protégé votre ordinateur ». Clique sur **Informations complémentaires**, puis **Exécuter quand même**.

            Tout ce que CustomWin modifie s'annule avec le bouton **Tout annuler**. En cas de souci avec le fond animé, le journal `%LOCALAPPDATA%\CustomWin\desktop.log` indique ce qui bloque.
          generate_release_notes: true
