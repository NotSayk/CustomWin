[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/desktop", "crates/taskbar", "app/src-tauri"]
# The Tauri app only builds on Windows; plain `cargo test` stays cross-platform.
default-members = ["crates/core", "crates/helper", "crates/desktop", "crates/taskbar"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NotSayk/CustomWin"
rust-version = "1.82"

[workspace.dependencies]
customwin-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
windows = "0.62"
windows-registry = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
