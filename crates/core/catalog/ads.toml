# Publicités et suggestions intégrées à Windows 11.
# Les valeurs ContentDeliveryManager sont par utilisateur et s'appliquent sans redémarrage.

[[tweak]]
id = "ads.start_recommendations"
category = "ads"
risk = "safe"
evidence = "functional"
tags = ["clean", "minimal"]
name = { fr = "Pas de pubs dans le menu Démarrer", en = "No ads in the Start menu" }
description = { fr = "Retire les applis et conseils « recommandés » par Microsoft dans le menu Démarrer.", en = "Removes the apps and tips Microsoft \"recommends\" in the Start menu." }

[[tweak.action]]
kind = "registry"
hive = "HKCU"
path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "Start_IrisRecommendations"
dword = 0

[[tweak.action]]
kind = "registry"
hive = "HKCU"
path = 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
name = "SubscribedContent-338388Enabled"
dword = 0

[[tweak.action]]
kind = "registry"
hive = "HKCU"
path = 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
name = "SystemPaneSuggestionsEnabled"
dword = 0

