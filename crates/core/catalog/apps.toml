# Applis préinstallées, supprimées pour l'utilisateur courant.
# Partiellement réversible : l'annulation les réinstalle depuis le Microsoft Store (winget),
# ce qui demande internet. Ces tweaks ne peuvent donc pas figurer dans un profil.
# Identifiants Store vérifiés auprès du Microsoft Store (octobre 2026).

[[tweak]]
id = "apps.news"
category = "apps"
risk = "safe"
evidence = "functional"
tags = ["clean"]
name = { fr = "Supprimer Microsoft Actualités", en = "Remove Microsoft News" }
description = { fr = "Retire l'application d'actualités MSN préinstallée.", en = "Removes the preinstalled MSN news app." }

[[tweak.action]]
kind = "appx"
package = "Microsoft.BingNews"
